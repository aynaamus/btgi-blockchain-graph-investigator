[project]
name = "btgi"
version = "0.1.0"
description = "Bitcoin Transaction Graph Investigator: DuckDB-backed graph analysis, explainable structural alerts and a Streamlit investigation app for the Elliptic data set"
requires-python = ">=3.12,<3.13"
dependencies = ["duckdb>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]
app = ["streamlit>=1.40", "plotly>=5.20"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
